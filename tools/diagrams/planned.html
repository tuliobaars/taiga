<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
body { width: 1280px; height: 800px; background: var(--bg); }
.t { position: absolute; inset: 40px; border: 4px dashed var(--line); border-radius: 40px; display: grid; place-content: center; justify-items: center; gap: 22px; text-align: center; padding: 40px; }
.badge { padding: 12px 26px; border-radius: 999px; font-size: 30px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--soft); color: var(--c); }
.fmt { font-size: 88px; font-weight: 800; letter-spacing: -.045em; color: var(--ink); line-height: 1; }
.app { font-size: 40px; font-weight: 650; color: var(--ink2); letter-spacing: -.02em; }
.fn { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 34px; color: var(--c); }
.what { font-size: 30px; color: var(--ink2); max-width: 980px; line-height: 1.35; }
</style></head><body>
<div class="t"><div class="badge">Planned &middot; not yet built</div><div class="fmt" id="fmt"></div><div class="app" id="app"></div><div class="fn" id="fn"></div><div class="what" id="what"></div></div>
<script>
const q = new URLSearchParams(location.search), dark = q.get('dark') === '1';
const c = { shiny: '#0e8f83', quarto: '#7c3aed', html: '#0071e3' }[q.get('format')] || '#6e6e73';
const r = document.documentElement.style;
r.setProperty('--c', dark ? { shiny: '#2cc5b4', quarto: '#b497f2', html: '#4aa3ff' }[q.get('format')] : c);
r.setProperty('--soft', dark ? 'rgba(255,255,255,.08)' : c + '18');
r.setProperty('--bg', dark ? '#0b0d13' : '#f3f5f6'); r.setProperty('--line', dark ? 'rgba(255,255,255,.18)' : '#cbd3d9');
r.setProperty('--ink', dark ? '#f4f4f6' : '#0f1720'); r.setProperty('--ink2', dark ? '#a1a1ad' : '#3a4651');
document.getElementById('fmt').textContent = { shiny: 'Shiny', quarto: 'Quarto', html: 'Standalone HTML' }[q.get('format')];
document.getElementById('app').textContent = q.get('app');
document.getElementById('fn').textContent = q.get('fn');
document.getElementById('what').textContent = q.get('what');
</script></body></html>
